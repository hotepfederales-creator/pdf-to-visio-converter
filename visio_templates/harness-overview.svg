<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">
  <title>Harness Overview Template</title>
  <style>
    .box{fill:#f8fafc;stroke:#334155;stroke-width:2}.pin{fill:#fff;stroke:#0f172a;stroke-width:1.5}
    .wire{fill:none;stroke:#111827;stroke-width:8;stroke-linecap:round}.branch{fill:none;stroke:#111827;stroke-width:4;stroke-linecap:round}
    .label{font-family:Segoe UI,Arial,sans-serif;font-size:18px;fill:#0f172a}.small{font-size:13px;fill:#475569}
  </style>
  <text x="40" y="45" class="label" font-size="28" font-weight="700">Harness Overview</text>
  <rect x="40" y="80" width="150" height="110" rx="12" class="box"/>
  <text x="115" y="126" text-anchor="middle" class="label">J1</text>
  <text x="115" y="152" text-anchor="middle" class="small">Source connector</text>
  <circle cx="190" cy="135" r="8" class="pin"/>
  <path d="M 198 135 L 850 135" class="wire"/>
  <rect x="850" y="80" width="170" height="110" rx="12" class="box"/>
  <text x="935" y="126" text-anchor="middle" class="label">J2</text>
  <text x="935" y="152" text-anchor="middle" class="small">Destination connector</text>
  <circle cx="850" cy="135" r="8" class="pin"/>
  <path d="M 430 135 C 430 210 320 210 320 285" class="branch"/>
  <rect x="230" y="285" width="180" height="95" rx="12" class="box"/>
  <text x="320" y="325" text-anchor="middle" class="label">J3</text>
  <text x="320" y="350" text-anchor="middle" class="small">Branch connector</text>
  <path d="M 620 135 C 620 250 715 250 715 365" class="branch"/>
  <rect x="625" y="365" width="180" height="95" rx="12" class="box"/>
  <text x="715" y="405" text-anchor="middle" class="label">J4</text>
  <text x="715" y="430" text-anchor="middle" class="small">Branch connector</text>
  <rect x="40" y="525" width="1010" height="85" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="65" y="555" class="small">Use as a Visio import base: replace connector labels, duplicate branch blocks, and add callouts for wire color, gauge, shield, splice, and loom notes.</text>
  <text x="65" y="582" class="small">Common labels: connector ID, backshell, cavity/pin range, branch length, tape/loom spec, revision.</text>
</svg>
